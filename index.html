<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Your Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: a showroom. The house, map or lot fills a quiet stage; one decision at a time sits beside it; the price stays in view at the foot. */
  :root {
    --paper: #f3f4f1; --card: #ffffff; --ink: #141b18; --soft: #5d6862; --line: #d9ddd6; --spruce: #1f3d32; --spruce-ink: #f3f4f1; --bronze: #8f6f43; --tint: #e7ebe4; --no: #9b3c2e;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif; --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 20px; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: 0.22em; font-size: 12.5px; text-transform: uppercase; }
  .brand span { color: var(--soft); font-weight: 500; }
  .steps { list-style: none; display: flex; gap: 4px; margin: 0; padding: 0; flex-wrap: wrap; }
  .steps button { background: none; border: 0; padding: 8px 10px; min-height: 40px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--soft); border-bottom: 2px solid transparent; }
  .steps button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--bronze); }
  .steps button:disabled { opacity: 0.45; cursor: default; }
  .steps .n { font-family: var(--display); font-size: 17px; margin-right: 5px; font-weight: 400; }
  .concept { font-size: 12px; color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); gap: 0; min-height: 0; }
  .stage { position: sticky; top: 0; align-self: start; padding: 0 0 12px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .frame.tall { aspect-ratio: 4 / 3; }
  .frame { position: relative; background: #dfe4dc; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.35s ease; }
  .frame img.on { opacity: 1; }
  .frame .svgwrap { position: absolute; inset: 0; background: #eef1ec; }
  .frame.tall .tag { display: none; }
  .frame svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 14px; bottom: 12px; background: rgba(20, 27, 24, 0.78); color: #f3f4f1; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; max-width: calc(100% - 28px); }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; padding: 0 2px; }
  .cap h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .cap p { margin: 0; color: var(--soft); font-variant-numeric: tabular-nums; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
  .thumbs button { border: 2px solid transparent; border-radius: 10px; padding: 0; background: #dfe4dc; cursor: pointer; overflow: hidden; width: 118px; aspect-ratio: 16 / 9; position: relative; }
  .thumbs button[aria-pressed="true"] { border-color: var(--spruce); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, 0.62)); padding: 10px 6px 4px; text-align: left; }
  .panel { padding: 4px 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; text-wrap: balance; }
  .panel .lede { margin: 0; color: var(--soft); max-width: 46ch; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group > h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); margin: 8px 0 0; font-weight: 700; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 15px; cursor: pointer; min-height: 56px; }
  .opt:hover { border-color: #b9c1b7; }
  .opt[aria-checked="true"] { border-color: var(--spruce); box-shadow: inset 0 0 0 1px var(--spruce); }
  .opt[aria-disabled="true"] { cursor: not-allowed; background: transparent; color: var(--soft); }
  .opt .t { font-weight: 600; }
  .opt .d { grid-column: 1; color: var(--soft); font-size: 14px; white-space: pre-line; }
  .opt .p { grid-row: 1 / span 2; grid-column: 2; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; font-size: 15px; }
  .opt .p small { display: block; color: var(--soft); font-weight: 500; font-size: 12.5px; }
  .opt .why { grid-column: 1 / -1; color: var(--no); font-size: 13.5px; font-weight: 600; }
  .opt .why.info { color: var(--soft); font-weight: 500; }
  .opt.home { grid-template-columns: 92px 1fr auto; }
  .opt.home img { width: 92px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; grid-row: 1 / span 2; background: #dfe4dc; }
  .opt.home .t { font-family: var(--display); font-size: 25px; font-weight: 400; line-height: 1; }
  .opt.home .p { grid-column: 3; }
  .opt.home .t, .opt.home .d { grid-column: 2; }
  .note { font-size: 13.5px; color: var(--soft); margin: 0; max-width: 52ch; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .facts div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .facts b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .facts span { font-size: 12.5px; color: var(--soft); }
  .sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .sum td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .sum td:last-child { text-align: right; white-space: nowrap; font-weight: 600; padding-left: 12px; }
  .sum small { display: block; color: var(--soft); font-size: 13px; }
  .sum tr.tot td { border-bottom: 0; font-size: 18px; padding-top: 14px; }
  .sum tr.tot td:last-child { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a, .links button { display: inline-flex; align-items: center; min-height: 46px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; }
  .time { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .time li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .time li span:first-child { color: var(--soft); font-variant-numeric: tabular-nums; }
  .bar { position: sticky; bottom: 0; z-index: 5; background: rgba(243, 244, 241, 0.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .total { display: grid; grid-template-columns: auto; line-height: 1.15; }
  .total .lbl { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); font-weight: 700; }
  .total .amt { font-family: var(--display); font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
  .total .sub { font-size: 12.5px; color: var(--soft); }
  .nav { display: flex; gap: 8px; align-items: center; }
  .nav button { min-height: 50px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid transparent; background: none; cursor: pointer; font-weight: 600; }
  .nav .primary { background: var(--spruce); color: var(--spruce-ink); padding: 10px 26px; }
  .nav .primary:disabled { background: #a9b3ab; cursor: not-allowed; }
  .nav #back:disabled { visibility: hidden; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--bronze); outline-offset: 2px; }
  /* map and site plan */
  .mp-water { fill: none; stroke: #9ec3cf; stroke-linecap: round; stroke-linejoin: round; }
  .mp-road { fill: none; stroke: #c9cec6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .mp-lbl { font-family: var(--body); fill: #7b857f; }
  .mp-shield { font-family: var(--body); font-weight: 700; fill: #8a938d; }
  .pin { cursor: pointer; }
  .pin circle.dot { fill: var(--card); stroke: var(--spruce); stroke-width: 3; }
  .pin.sel circle.dot { fill: var(--spruce); }
  .pin text { font-family: var(--body); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #eef1ec; stroke-linejoin: round; }
  .pin.off { opacity: 0.5; }
  .lot { stroke: #ffffff; stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
  .lot.open { fill: #cfdccb; } .lot.nofit { fill: #e4e6e1; cursor: not-allowed; } .lot.held { fill: #e9dcc5; cursor: not-allowed; } .lot.sold { fill: #dcdedb; cursor: not-allowed; }
  .lot.sel { fill: var(--spruce); }
  .lotn { font-family: var(--body); font-weight: 700; fill: #33403a; pointer-events: none; text-anchor: middle; }
  .lotn.sel { fill: #f3f4f1; } .lotn.dim { fill: #9aa39d; }
  .sp-lbl { font-family: var(--body); fill: #7b857f; font-weight: 600; letter-spacing: 0.08em; }
  .key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); padding: 0 2px; }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .plot { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .plot svg { width: 100%; height: auto; display: block; max-height: 360px; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .stage { position: static; padding: 0 14px; } .panel { padding: 14px 14px 20px; }
    .top { padding: 10px 14px; } .steps button .w { display: none; } .steps button[aria-current="step"] .w { display: inline; }
    .steps button { padding: 8px 7px; }
    .bar { padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); } .total .amt { font-size: 30px; } .total .sub { display: none; }
    .nav .primary { padding: 10px 18px; } .panel h2 { font-size: 30px; }
    .thumbs button { width: 96px; }
    .opt.home { grid-template-columns: 96px 1fr; column-gap: 12px; }
    .opt.home img { width: 96px; grid-row: 1 / span 3; align-self: start; }
    .opt.home .t { grid-row: 1; } .opt.home .d { grid-row: 2; } .opt.home .p { grid-row: 3; grid-column: 2; text-align: left; font-size: 14px; color: var(--soft); }
    .steps { order: 3; width: 100%; }
    .frame.tall { aspect-ratio: 1 / 1; }
  }
  @media (prefers-reduced-motion: reduce) { .frame img { transition: none; } }
</style>
<style id="skin-v2">
  /* v2 skin: a white showroom. The picture fills the left of the screen from the top bar to the price bar; one choice at a time sits in a narrow column beside it. */
  :root { --paper: #ffffff; --card: #ffffff; --ink: #121416; --soft: #5a5f63; --line: #e2e3e0; --spruce: #121416; --spruce-ink: #ffffff; --bronze: #a8472e; --tint: #f4f4f2; --barh: 78px; --toph: 56px;
    --display: "Outfit", "Helvetica Neue", Arial, sans-serif; }
  body { background: #fff; }
  .top { position: sticky; top: 0; z-index: 6; background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 0 24px; min-height: var(--toph); }
  .brand { font-family: var(--display); font-weight: 600; letter-spacing: 0.3em; font-size: 12px; }
  .steps button { font-weight: 500; font-size: 13.5px; transition: color 0.15s; } .steps button:hover:not(:disabled) { color: var(--ink); }
  .steps .n { font-family: var(--body); font-size: 11.5px; font-weight: 600; opacity: 0.6; margin-right: 6px; }
  .steps button[aria-current="step"] { border-bottom-color: var(--ink); }
  .concept { font-size: 11.5px; letter-spacing: 0.04em; }
  main { grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); }
  .stage { top: var(--toph); height: calc(100vh - var(--toph) - var(--barh)); height: calc(100dvh - var(--toph) - var(--barh)); padding: 0; gap: 0; background: var(--tint); }
  .frame, .frame.tall { flex: 1 1 auto; aspect-ratio: auto; min-height: 0; border-radius: 0; background: var(--tint); }
  .frame img { transition: opacity 0.5s ease; }
  .frame .svgwrap { background: #f1f2ef; }
  .tag { left: 20px; bottom: 16px; background: rgba(18, 20, 22, 0.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-size: 12px; border-radius: 999px; padding: 6px 12px; }
  .cap { padding: 14px 24px 0; align-items: baseline; }
  .cap h1 { font-weight: 500; font-size: clamp(26px, 2.5vw, 36px); letter-spacing: -0.015em; }
  .cap p { font-size: 14.5px; }
  .thumbs { padding: 10px 24px 16px; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .thumbs::-webkit-scrollbar { display: none; }
  .thumbs button { flex: 0 0 auto; width: 96px; border-radius: 8px; border-width: 1.5px; transition: border-color 0.15s, transform 0.1s; } .thumbs button:active { transform: scale(0.97); }
  .thumbs button[aria-pressed="true"] { border-color: var(--ink); }
  .key { padding: 0 24px 14px; }
  .panel { padding: 26px 28px 30px 30px; gap: 16px; border-left: 1px solid var(--line); min-height: calc(100vh - var(--toph) - var(--barh)); }
  .panel h2 { font-weight: 500; font-size: 30px; letter-spacing: -0.015em; }
  .panel .lede { font-size: 15.5px; }
  .opt { border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s; }
  .opt:hover { border-color: #b9bcb8; } .opt:active { transform: scale(0.993); }
  .opt[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .opt.home { grid-template-columns: 104px 1fr; column-gap: 14px; }
  .opt.home img { width: 104px; border-radius: 8px; grid-row: 1 / span 3; align-self: center; }
  .opt.home .t { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; grid-row: 1; }
  .opt.home .d { grid-row: 2; }
  .opt.home .p { grid-row: 3; grid-column: 2; text-align: left; font-size: 14px; color: var(--ink); }
  .facts b, .sum tr.tot td:last-child { font-weight: 500; letter-spacing: -0.01em; }
  .bar { background: rgba(255, 255, 255, 0.94); min-height: var(--barh); padding: 8px 24px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .total .amt { font-weight: 500; font-size: 30px; letter-spacing: -0.015em; }
  .nav .primary { background: var(--ink); color: #fff; min-width: 168px; transition: background 0.15s, transform 0.08s; } .nav .primary:hover:not(:disabled) { background: #2b2e31; } .nav .primary:active:not(:disabled) { transform: scale(0.98); }
  .nav .primary:disabled { background: #b9bcb8; }
  .links a, .links button { transition: background 0.15s, color 0.15s; } .links a:hover, .links button:hover { background: var(--ink); color: #fff; }
  /* looks as swatches */
  .swatches { display: flex; gap: 10px; justify-content: center; padding: 6px 0 0; }
  .sw { width: 60px; height: 60px; border-radius: 50%; border: 0; padding: 5px; background: none; cursor: pointer; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow 0.18s; }
  .sw i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14); }

  .lookcard .pr { font-variant-numeric: tabular-nums; font-weight: 600; }

  .lookcard small { color: var(--soft); letter-spacing: 0.12em; text-transform: uppercase; font-size: 11.5px; font-weight: 700; }

  .panel.in > * { animation: rise 0.36s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

  .intro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
  .intro .in-top { position: relative; z-index: 1; text-align: center; padding: max(6vh, 44px) 24px 0; color: var(--ink); }
  .intro .kick { font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; font-family: var(--display); margin: 0 0 14px; }
  .intro h1 { font-family: var(--display); font-weight: 500; font-size: clamp(38px, 5.2vw, 68px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 12px; text-wrap: balance; }

  .intro .cta button, .intro .cta a { min-height: 52px; min-width: 232px; padding: 12px 22px; border-radius: 999px; border: 0; font: 600 16px var(--body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.08s, background 0.15s; }
  .intro .cta .go { background: var(--ink); color: #fff; } .intro .cta .go:hover { background: #2b2e31; }
  .intro .cta .alt { background: rgba(255, 255, 255, 0.92); color: var(--ink); } .intro .cta .alt:hover { background: #fff; }
  .intro .cta button:active, .intro .cta a:active { transform: scale(0.98); }
  .intro .fine { position: absolute; z-index: 1; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11.5px; color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); margin: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .top { position: static; padding: 10px 16px 0; }
    .stage { position: static; height: auto; padding: 0; }
    .frame { aspect-ratio: 16 / 10; flex: none; } .frame.tall { aspect-ratio: 1 / 1; flex: none; }
    .cap { padding: 12px 16px 0; } .thumbs { padding: 10px 16px 6px; } .key { padding: 4px 16px 0; }
    .panel { padding: 18px 16px 24px; border-left: 0; min-height: 0; } .panel h2 { font-size: 27px; }
    .bar { padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); } .total .amt { font-size: 26px; }
    .nav .primary { min-width: 0; }
    .sw { width: 56px; height: 56px; }

<body>
<section class="intro gone" id="intro" aria-label="Welcome">
  <img src="img/hero_brick.jpg" alt="A two-story brick home with a covered porch and a lookout room above the roof">
  <div class="in-top"><p class="kick">Your Brand Homes</p><h1>Design your home.</h1><p class="sub">Seven plans. Five looks. The price in view the whole way.</p></div>
  <div class="cta"><button type="button" class="go" id="begin">Start designing</button><a class="alt" id="intro-walk" href="#">Walk through in 3D</a></div>
  <p class="fine">Concept preview. Rendering of the 3D model.</p>
</section>
<div class="app">
  <header class="top">
