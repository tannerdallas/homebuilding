<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmhouse 3D Models</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* One daylight scene, single theme by choice. Layout: full-bleed 3D stage, a title plate top left, a control dock along the bottom.
     Walkthrough mode swaps the dock for floor and room shortcuts and adds a small floor map top right. */
  --sky: #dfe7ee;
  --ink: #17212b;
  --plate: #ffffff;
  --line: #c9d1da;
  --muted: #4b5a67;
  --accent: #1b56b3;
  --accent-ink: #ffffff;
  --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --body: Barlow, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 20px; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 4px; background: rgba(23, 33, 43, 0.82); color: #ffffff; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; will-change: transform; }
header { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.plate { background: var(--plate); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; pointer-events: auto; max-width: 100%; box-sizing: border-box; }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 24px; letter-spacing: 0.2px; text-wrap: balance; }
.sub { margin: 2px 0 0 0; color: var(--muted); font-size: 13px; line-height: 17px; }
#map { position: absolute; right: 12px; top: 12px; background: rgba(255, 255, 255, 0.94); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; touch-action: manipulation; }
#dock { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#orbit-ui, #walk-ui { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; }
#hint { background: rgba(255, 255, 255, 0.86); border-radius: 6px; padding: 3px 10px; color: var(--muted); font-size: 13px; line-height: 18px; text-align: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto; max-width: 100%; }
.seg { display: flex; background: var(--plate); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; pointer-events: auto; max-width: 100%; }
.seg button { border: 0; border-right: 1px solid var(--line); border-radius: 0; }
.seg button:last-child { border-right: 0; }
button { font: inherit; font-weight: 500; color: var(--ink); background: var(--plate); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 13px; cursor: pointer; white-space: nowrap; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 0 22px; pointer-events: auto; }
.primary:focus-visible { outline-color: #ffffff; }
.plain { pointer-events: auto; }
.chips { display: flex; gap: 8px; width: 100%; box-sizing: border-box; overflow-x: auto; pointer-events: auto; scrollbar-width: none; padding: 1px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips::before, .chips::after { content: ""; flex: 1 0 0px; }
.chips button { flex: 0 0 auto; }
.chips button[aria-current="true"] { background: var(--ink); color: #ffffff; border-color: var(--ink); }
.cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); background: rgba(255, 255, 255, 0.86); border-radius: 5px; padding: 1px 7px; }
.grp { display: flex; flex-direction: column; gap: 3px; align-items: center; max-width: 100%; }
.walking header { right: 156px; }
.walking #labels { display: none; }
#fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--sky); }
#fallback p { background: var(--plate); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; max-width: 420px; margin: 0; }
@media (max-width: 430px) {
  button { padding: 0 9px; font-size: 14px; }
  .primary { padding: 0 18px; font-size: 15px; }
  h1 { font-size: 18px; line-height: 22px; }
}
@media (max-height: 480px) {
  #hint, .cap { display: none; }
  #dock, #orbit-ui, #walk-ui { gap: 6px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage" role="img" aria-label="Interactive 3D model of the farmhouse plans"></div>
  <div id="labels" aria-hidden="true"></div>
  <header>
    <div class="plate">
      <h1 id="title">Farmhouse 3D Models</h1>
      <p class="sub" id="sub">Concept models from the floor plans, not for construction</p>
    </div>
    <div class="seg" role="group" aria-label="Choose a plan">
      <button type="button" id="m-big" aria-pressed="true">3,928 sq ft</button>
      <button type="button" id="m-small" aria-pressed="false">2,792 sq ft</button>
    </div>
  </header>
  <canvas id="map" width="128" height="128" aria-hidden="true" hidden></canvas>
  <div id="dock">
    <div id="hint">Drag to rotate, pinch to zoom, two fingers to move</div>
    <div id="orbit-ui">
      <div class="grp">
        <span class="cap">Open the house to</span>
        <div class="seg" role="group" aria-label="Open the house to a level">
          <button type="button" id="l-exterior" aria-pressed="true">Exterior</button>
          <button type="button" id="l-lookout" aria-pressed="false">Lookout</button>
          <button type="button" id="l-upper" aria-pressed="false">Upstairs</button>
          <button type="button" id="l-main" aria-pressed="false">Main floor</button>
        </div>
      </div>
      <div class="row">
        <button type="button" id="v-front">Front</button>
        <button type="button" id="v-back">Back</button>
        <button type="button" id="v-above">From above</button>
        <button type="button" id="t-labels" aria-pressed="true">Room names</button>
      </div>
      <button type="button" class="primary" id="b-walk">Walk through the house</button>
    </div>
    <div id="walk-ui" hidden>
      <div class="seg" role="group" aria-label="Go to a floor">
        <button type="button" id="f-0" aria-pressed="true">Main floor</button>
        <button type="button" id="f-1" aria-pressed="false">Upstairs</button>
        <button type="button" id="f-2" aria-pressed="false">Lookout</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Walk to a room"></div>
      <button type="button" class="plain" id="b-exit">Back to the model</button>
    </div>
  </div>
  <div id="fallback" hidden><p id="fallback-msg"></p></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="model-big.js"></script>
<script src="model-small.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
</body>
</html>
